name: SEO upkeep

# After every production push: wait for Vercel to deploy, then tell Bing (and
# ChatGPT search / Copilot through it) which URLs changed. Weekly: check that
# every URL in the sitemap still answers 200.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  indexnow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel deployment to go live
        # Vercel builds in two to four minutes; the previous deployment keeps
        # answering meanwhile, so a probe cannot tell them apart. Wait it out.
        run: sleep 300
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/seo/indexnow.mjs

  linkcheck:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Every sitemap URL answers 200
        run: |
          urls=$(curl -fsS https://sklo.studio/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          bad=0
          for u in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$u")
            [ "$code" = "200" ] || { echo "$code $u"; bad=$((bad+1)); }
          done
          echo "checked $(echo "$urls" | wc -l) URLs, $bad failing"
          [ "$bad" -eq 0 ]
